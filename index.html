<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E6DECB">
  <title>머묾 · 생각이 머무는 자리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* ============================================================
       1. 디자인 토큰 (색상·간격 등 "재료 창고")
       - 메인: 약간 어두운 아이보리 / 보조: 보라 계열
       ============================================================ */
    :root {
      --bg:        #E6DECB;   /* 메인: 어두운 아이보리 (화면 바탕) */
      --surface:   #F3EEE2;   /* 카드·입력창 바탕 (밝은 아이보리) */
      --surface-2: #DCD3BE;   /* 구분선·눌림 상태 */
      --ink:       #2F2B27;   /* 본문 글자 */
      --ink-soft:  #6B645A;   /* 보조 글자 */
      --ink-faint: #9A9285;   /* 아주 흐린 글자 */
      --purple:    #6A5A8C;   /* 보조: 보라 (버튼·강조) */
      --purple-dk: #4F4170;   /* 보라 눌림 */
      --purple-lt: #E4DDEE;   /* 연보라 (태그 배경) */
      --danger:    #A2504A;
      --radius:    16px;
      --touch:     48px;      /* 손가락 터치 최소 크기 */
      --shadow:    0 6px 24px rgba(47, 43, 39, .08);
      --serif: 'Gowun Batang', 'Apple Myungjo', serif;
      --sans:  'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: #CFC6B2;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* 모바일 앱처럼 보이도록 가운데 정렬된 폰 화면 */
    .phone {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,.12);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ============================================================
       2. 상단 네비게이션
       ============================================================ */
    .topbar {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(230, 222, 203, .94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--surface-2);
      padding-top: env(safe-area-inset-top);
    }
    .topbar-row {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; padding: 0 16px;
    }
    .logo { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    .logo small { font-family: var(--sans); font-size: 12px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
    .avatar-btn {
      width: var(--touch); height: var(--touch);
      display: grid; place-items: center; border: 0; background: none; cursor: pointer; padding: 0;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
      background: var(--purple-lt); color: var(--purple);
      display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .avatar.lg { width: 72px; height: 72px; font-size: 26px; }
    .tabs { display: flex; padding: 0 8px; }
    .tabs a {
      flex: 1; text-align: center; min-height: var(--touch);
      display: grid; place-items: center;
      font-size: 15px; color: var(--ink-soft); border-bottom: 2px solid transparent;
    }
    .tabs a.active { color: var(--purple); font-weight: 700; border-bottom-color: var(--purple); }

    /* ============================================================
       3. 공통 컴포넌트
       ============================================================ */
    .page { padding: 20px 16px 48px; }
    .page-title { font-family: var(--serif); font-size: 24px; margin: 4px 0 4px; }
    .page-sub { color: var(--ink-soft); margin: 0 0 20px; font-size: 14px; }
    .section-title { font-family: var(--serif); font-size: 18px; margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
    .section-title a { font-family: var(--sans); font-size: 13px; color: var(--purple); }

    .btn {
      min-height: var(--touch); padding: 0 20px; border-radius: 12px;
      border: 1px solid transparent; cursor: pointer; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-dk); }
    .btn-ghost { background: var(--surface); border-color: var(--surface-2); }
    .btn-danger { background: none; color: var(--danger); border-color: var(--danger); }
    .btn-block { width: 100%; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 999px;
      border: 1px solid var(--surface-2); background: var(--surface); color: var(--ink-soft);
      cursor: pointer; font-size: 14px;
    }
    .chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

    .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--purple-lt); color: var(--purple-dk); }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
    .input, .select, .textarea {
      width: 100%; min-height: var(--touch); padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--surface-2); background: var(--surface);
      outline: none; transition: border-color .15s;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--purple); }
    .textarea { min-height: 140px; resize: vertical; line-height: 1.7; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }

    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .muted { color: var(--ink-soft); font-size: 14px; }
    .faint { color: var(--ink-faint); font-size: 13px; }
    .divider { height: 1px; background: var(--surface-2); margin: 24px 0; border: 0; }

    /* 공간 카드 (목록용) */
    .post-list { display: grid; gap: 16px; }
    .post-card { display: block; cursor: pointer; }
    .post-card .thumb { aspect-ratio: 4/3; width: 100%; object-fit: cover; background: var(--surface-2); }
    .post-card .body { padding: 14px 16px 16px; }
    .post-card h3 { font-family: var(--serif); font-size: 18px; margin: 6px 0 4px; }
    .post-card p { margin: 0; color: var(--ink-soft); font-size: 14px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--ink-faint); }

    /* 가로 스크롤 카드 (홈) */
    .h-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-scroll .post-card { flex: 0 0 72%; scroll-snap-align: start; }

    /* 지도 */
    .map { height: 260px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); z-index: 0; }
    .map.sm { height: 200px; }
    .leaflet-popup-content { font-family: var(--sans); }
    .leaflet-popup-content a { color: var(--purple); font-weight: 700; }

    /* 인용구 (홈 상단) */
    .quote {
      font-family: var(--serif); font-size: 17px; line-height: 1.8;
      padding: 20px; border-left: 3px solid var(--purple); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0;
    }
    .quote span { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-faint); font-family: var(--sans); }

    /* 카테고리 바로가기 */
    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .cat-grid a { background: var(--surface); border-radius: 14px; padding: 14px 4px; text-align: center; font-size: 13px; min-height: 80px; display: grid; place-items: center; gap: 4px; box-shadow: var(--shadow); }
    .cat-grid .ico { font-size: 24px; line-height: 1; }

    /* 상세 페이지 */
    .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: -20px -16px 0; scrollbar-width: none; }
    .gallery::-webkit-scrollbar { display: none; }
    .gallery img { flex: 0 0 100%; aspect-ratio: 4/3; object-fit: cover; scroll-snap-align: start; }
    .gallery-count { text-align: right; font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
    .detail-title { font-family: var(--serif); font-size: 26px; margin: 12px 0 4px; }
    .author { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
    .author b { display: block; font-size: 15px; }
    .caption { font-family: var(--serif); font-size: 17px; line-height: 1.9; white-space: pre-wrap; margin: 0; }
    .like-btn { border: 1px solid var(--surface-2); background: var(--surface); border-radius: 999px; min-height: var(--touch); padding: 0 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .like-btn.on { background: var(--purple-lt); border-color: var(--purple); color: var(--purple-dk); }

    .comment { display: flex; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--surface-2); }
    .comment .avatar { width: 32px; height: 32px; font-size: 13px; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-body p { margin: 2px 0 0; font-size: 15px; word-break: break-word; }
    .comment-del { background: none; border: 0; color: var(--ink-faint); cursor: pointer; font-size: 13px; min-height: 32px; }
    .comment-form { display: flex; gap: 8px; margin-top: 16px; }
    .comment-form .input { flex: 1; }

    /* 작성 페이지 */
    .write-meta { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; font-size: 14px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-grid .slot { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
    .photo-grid .slot img { width: 100%; height: 100%; object-fit: cover; }
    .photo-grid .slot button { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
    .photo-add { aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed var(--ink-faint); background: none; display: grid; place-items: center; color: var(--ink-soft); cursor: pointer; font-size: 13px; }
    .picker { margin-top: 12px; padding: 12px; background: var(--surface); border-radius: 12px; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
    .picker-grid img { aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; border: 3px solid transparent; }
    .picker-grid img.sel { border-color: var(--purple); }

    /* 로그인 */
    .auth { min-height: calc(100vh - 0px); display: flex; flex-direction: column; justify-content: center; padding: 40px 24px; }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo h1 { font-family: var(--serif); font-size: 44px; margin: 0; letter-spacing: 2px; }
    .auth-logo p { margin: 6px 0 0; color: var(--ink-soft); font-family: var(--serif); }
    .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .seg button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: none; cursor: pointer; color: var(--ink-soft); }
    .seg button.active { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .or { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: 13px; margin: 24px 0 16px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--surface-2); }
    .sns { display: grid; gap: 10px; }
    .sns .kakao { background: #FEE500; color: #191919; }
    .sns .naver { background: #03C75A; color: #fff; }
    .sns .google { background: #fff; border-color: var(--surface-2); }
    .hint { margin-top: 20px; text-align: center; font-size: 13px; color: var(--ink-faint); }

    /* 마이페이지 */
    .profile { display: flex; gap: 16px; align-items: center; padding: 20px; }
    .profile h2 { font-family: var(--serif); margin: 0; font-size: 20px; }
    .stats { display: flex; gap: 20px; margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
    .stats b { color: var(--ink); }

    .empty { text-align: center; padding: 48px 16px; color: var(--ink-faint); }
    .empty .ico { font-size: 36px; }

    /* 알림 토스트 */
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 2000; max-width: 90%;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .loading { text-align: center; padding: 80px 16px; color: var(--ink-faint); }
    .loading::before { content: ""; display: block; width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%;
      border: 3px solid var(--surface-2); border-top-color: var(--purple); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn[disabled] { opacity: .6; pointer-events: none; }

    .back { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; color: var(--ink-soft); font-size: 14px; background: none; border: 0; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar" id="topbar" hidden>
      <div class="topbar-row">
        <a href="#/home" class="logo">머묾<small>생각이 머무는 자리</small></a>
        <a href="#/my" class="avatar-btn" aria-label="마이페이지" id="topAvatar"></a>
      </div>
      <nav class="tabs" id="tabs">
        <a href="#/home"  data-tab="home">홈</a>
        <a href="#/list"  data-tab="list">공간</a>
        <a href="#/write" data-tab="write">기록하기</a>
        <a href="#/my"    data-tab="my">내 정보</a>
      </nav>
    </header>
    <main id="app"></main>
  </div>
  <div class="toast" id="toast"></div>

  <!-- Supabase(온라인 데이터베이스) 연결 도구 + 앱 코드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
