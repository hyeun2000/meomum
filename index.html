<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E6DECB">
  <title>머묾 · 생각이 머무는 자리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* ============================================================
       1. 디자인 토큰 (색상·간격 등 "재료 창고")
       - 메인: 약간 어두운 아이보리 / 보조: 보라 계열
       ============================================================ */
    :root {
      --bg:        #E6DECB;   /* 메인: 어두운 아이보리 (화면 바탕) */
      --surface:   #F3EEE2;   /* 카드·입력창 바탕 (밝은 아이보리) */
      --surface-2: #DCD3BE;   /* 구분선·눌림 상태 */
      --ink:       #2F2B27;   /* 본문 글자 */
      --ink-soft:  #6B645A;   /* 보조 글자 */
      --ink-faint: #9A9285;   /* 아주 흐린 글자 */
      --purple:    #6A5A8C;   /* 보조: 보라 (버튼·강조) */
      --purple-dk: #4F4170;   /* 보라 눌림 */
      --purple-lt: #E4DDEE;   /* 연보라 (태그 배경) */
      --danger:    #A2504A;
      --radius:    16px;
      --touch:     48px;      /* 손가락 터치 최소 크기 */
      --shadow:    0 6px 24px rgba(47, 43, 39, .08);
      --serif: 'Gowun Batang', 'Apple Myungjo', serif;
      --sans:  'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: #CFC6B2;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* 모바일 앱처럼 보이도록 가운데 정렬된 폰 화면 */
    .phone {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,.12);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ============================================================
       2. 상단 네비게이션
       ============================================================ */
    .topbar {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(230, 222, 203, .94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--surface-2);
      padding-top: env(safe-area-inset-top);
    }
    .topbar-row {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; padding: 0 16px;
    }
    .logo { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    .logo small { font-family: var(--sans); font-size: 12px; color: var(--ink-faint); font-weight: 400; margin-left: 6px; }
    .avatar-btn {
      width: var(--touch); height: var(--touch);
      display: grid; place-items: center; border: 0; background: none; cursor: pointer; padding: 0;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
      background: var(--purple-lt); color: var(--purple);
      display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .avatar.lg { width: 72px; height: 72px; font-size: 26px; }
    .tabs { display: flex; padding: 0 8px; }
    .tabs a {
      flex: 1; text-align: center; min-height: var(--touch);
      display: grid; place-items: center;
      font-size: 15px; color: var(--ink-soft); border-bottom: 2px solid transparent;
    }
    .tabs a.active { color: var(--purple); font-weight: 700; border-bottom-color: var(--purple); }

    /* ============================================================
       3. 공통 컴포넌트
       ============================================================ */
    .page { padding: 20px 16px 48px; }
    .page-title { font-family: var(--serif); font-size: 24px; margin: 4px 0 4px; }
    .page-sub { color: var(--ink-soft); margin: 0 0 20px; font-size: 14px; }
    .section-title { font-family: var(--serif); font-size: 18px; margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
    .section-title a { font-family: var(--sans); font-size: 13px; color: var(--purple); }

    .btn {
      min-height: var(--touch); padding: 0 20px; border-radius: 12px;
      border: 1px solid transparent; cursor: pointer; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-dk); }
    .btn-ghost { background: var(--surface); border-color: var(--surface-2); }
    .btn-danger { background: none; color: var(--danger); border-color: var(--danger); }
    .btn-block { width: 100%; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 999px;
      border: 1px solid var(--surface-2); background: var(--surface); color: var(--ink-soft);
      cursor: pointer; font-size: 14px;
    }
    .chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

    .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--purple-lt); color: var(--purple-dk); }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
    .input, .select, .textarea {
      width: 100%; min-height: var(--touch); padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--surface-2); background: var(--surface);
      outline: none; transition: border-color .15s;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--purple); }
    .textarea { min-height: 140px; resize: vertical; line-height: 1.7; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }

    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .muted { color: var(--ink-soft); font-size: 14px; }
    .faint { color: var(--ink-faint); font-size: 13px; }
    .divider { height: 1px; background: var(--surface-2); margin: 24px 0; border: 0; }

    /* 공간 카드 (목록용) */
    .post-list { display: grid; gap: 16px; }
    .post-card { display: block; cursor: pointer; }
    .post-card .thumb { aspect-ratio: 4/3; width: 100%; object-fit: cover; background: var(--surface-2); }
    .post-card .body { padding: 14px 16px 16px; }
    .post-card h3 { font-family: var(--serif); font-size: 18px; margin: 6px 0 4px; }
    .post-card p { margin: 0; color: var(--ink-soft); font-size: 14px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--ink-faint); }

    /* 가로 스크롤 카드 (홈) */
    .h-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-scroll .post-card { flex: 0 0 72%; scroll-snap-align: start; }

    /* 지도 */
    .map { height: 260px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); z-index: 0; }
    .map.sm { height: 200px; }
    .leaflet-popup-content { font-family: var(--sans); }
    .leaflet-popup-content a { color: var(--purple); font-weight: 700; }

    /* 인용구 (홈 상단) */
    .quote {
      font-family: var(--serif); font-size: 17px; line-height: 1.8;
      padding: 20px; border-left: 3px solid var(--purple); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0;
    }
    .quote span { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-faint); font-family: var(--sans); }

    /* 카테고리 바로가기 */
    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .cat-grid a { background: var(--surface); border-radius: 14px; padding: 14px 4px; text-align: center; font-size: 13px; min-height: 80px; display: grid; place-items: center; gap: 4px; box-shadow: var(--shadow); }
    .cat-grid .ico { font-size: 24px; line-height: 1; }

    /* 상세 페이지 */
    .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: -20px -16px 0; scrollbar-width: none; }
    .gallery::-webkit-scrollbar { display: none; }
    .gallery img { flex: 0 0 100%; aspect-ratio: 4/3; object-fit: cover; scroll-snap-align: start; }
    .gallery-count { text-align: right; font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
    .detail-title { font-family: var(--serif); font-size: 26px; margin: 12px 0 4px; }
    .author { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
    .author b { display: block; font-size: 15px; }
    .caption { font-family: var(--serif); font-size: 17px; line-height: 1.9; white-space: pre-wrap; margin: 0; }
    .like-btn { border: 1px solid var(--surface-2); background: var(--surface); border-radius: 999px; min-height: var(--touch); padding: 0 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .like-btn.on { background: var(--purple-lt); border-color: var(--purple); color: var(--purple-dk); }

    .comment { display: flex; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--surface-2); }
    .comment .avatar { width: 32px; height: 32px; font-size: 13px; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-body p { margin: 2px 0 0; font-size: 15px; word-break: break-word; }
    .comment-del { background: none; border: 0; color: var(--ink-faint); cursor: pointer; font-size: 13px; min-height: 32px; }
    .comment-form { display: flex; gap: 8px; margin-top: 16px; }
    .comment-form .input { flex: 1; }

    /* 작성 페이지 */
    .write-meta { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; font-size: 14px; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-grid .slot { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
    .photo-grid .slot img { width: 100%; height: 100%; object-fit: cover; }
    .photo-grid .slot button { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
    .photo-add { aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed var(--ink-faint); background: none; display: grid; place-items: center; color: var(--ink-soft); cursor: pointer; font-size: 13px; }
    .picker { margin-top: 12px; padding: 12px; background: var(--surface); border-radius: 12px; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
    .picker-grid img { aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; border: 3px solid transparent; }
    .picker-grid img.sel { border-color: var(--purple); }

    /* 로그인 */
    .auth { min-height: calc(100vh - 0px); display: flex; flex-direction: column; justify-content: center; padding: 40px 24px; }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo h1 { font-family: var(--serif); font-size: 44px; margin: 0; letter-spacing: 2px; }
    .auth-logo p { margin: 6px 0 0; color: var(--ink-soft); font-family: var(--serif); }
    .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .seg button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: none; cursor: pointer; color: var(--ink-soft); }
    .seg button.active { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .or { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: 13px; margin: 24px 0 16px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--surface-2); }
    .sns { display: grid; gap: 10px; }
    .sns .kakao { background: #FEE500; color: #191919; }
    .sns .naver { background: #03C75A; color: #fff; }
    .sns .google { background: #fff; border-color: var(--surface-2); }
    .hint { margin-top: 20px; text-align: center; font-size: 13px; color: var(--ink-faint); }

    /* 마이페이지 */
    .profile { display: flex; gap: 16px; align-items: center; padding: 20px; }
    .profile h2 { font-family: var(--serif); margin: 0; font-size: 20px; }
    .stats { display: flex; gap: 20px; margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
    .stats b { color: var(--ink); }

    .empty { text-align: center; padding: 48px 16px; color: var(--ink-faint); }
    .empty .ico { font-size: 36px; }

    /* 알림 토스트 */
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 2000; max-width: 90%;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .back { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; color: var(--ink-soft); font-size: 14px; background: none; border: 0; cursor: pointer; padding: 0; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar" id="topbar" hidden>
      <div class="topbar-row">
        <a href="#/home" class="logo">머묾<small>생각이 머무는 자리</small></a>
        <a href="#/my" class="avatar-btn" aria-label="마이페이지" id="topAvatar"></a>
      </div>
      <nav class="tabs" id="tabs">
        <a href="#/home"  data-tab="home">홈</a>
        <a href="#/list"  data-tab="list">공간</a>
        <a href="#/write" data-tab="write">기록하기</a>
        <a href="#/my"    data-tab="my">내 정보</a>
      </nav>
    </header>
    <main id="app"></main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  /* ================================================================
     머묾 (Meomum) — 프로토타입
     · 실제 서버 대신 브라우저 저장소(localStorage)를 "임시 DB"로 사용합니다.
     · 테이블 구조는 기획서의 users / posts / comments 를 그대로 따릅니다.
       (공간 서비스에 필요한 장소명·카테고리·지역·좌표 컬럼을 posts 에 추가)
     ================================================================ */

  const CATEGORIES = [
    { key: '브런치카페', ico: '🥐' },
    { key: '혼술바',     ico: '🥃' },
    { key: '식당',       ico: '🍲' },
    { key: '카페',       ico: '☕' },
  ];
  const REGIONS = [
    { key: '서울', center: [37.5665, 126.9780], zoom: 12 },
    { key: '경기', center: [37.4138, 127.0183], zoom: 9 },
    { key: '부산', center: [35.1631, 129.0950], zoom: 12 },
    { key: '강원', center: [37.7519, 128.8761], zoom: 9 },
    { key: '제주', center: [33.4100, 126.5500], zoom: 10 },
  ];
  const KOREA = { center: [36.3, 127.8], zoom: 7 };

  /* ---------- 1. 임시 DB (localStorage) ---------- */
  const DB_KEY = 'meomum_db_v1';
  const SESSION_KEY = 'meomum_session_v1';
  let db;

  function now(offsetMin = 0) { return new Date(Date.now() - offsetMin * 60000).toISOString(); }
  const img = seed => `https://picsum.photos/seed/${seed}/800/600`;

  function seedData() {
    return {
      seq: { users: 3, posts: 6, comments: 4 },
      users: [
        { id: 1, username: 'demo', email: 'demo@meomum.kr', password: '1234', display_name: '이서윤',
          bio: '퇴근 후 혼자 있는 시간을 좋아합니다.', profile_image: '', address: '서울 종로구', created_at: now(60*24*40) },
        { id: 2, username: 'quietwalk', email: 'walk@meomum.kr', password: '1234', display_name: '한도윤',
          bio: '조용한 골목을 걷습니다.', profile_image: '', address: '부산 수영구', created_at: now(60*24*90) },
        { id: 3, username: 'slowpage', email: 'page@meomum.kr', password: '1234', display_name: '정하람',
          bio: '책 한 권, 커피 한 잔.', profile_image: '', address: '제주 제주시', created_at: now(60*24*120) },
      ],
      posts: [
        { id: 1, user_id: 2, place_name: '골목 끝 서재', category: '카페', region: '서울', address: '서울 종로구 서촌',
          lat: 37.5794, lng: 126.9700, caption: '창가 자리에 앉으면 오후 햇살이 책장 위로 천천히 내려옵니다.\n음악도 낮고, 손님도 많지 않아서 한 시간쯤 아무 생각 없이 앉아 있었어요. 생각을 정리하고 싶은 날 추천합니다.',
          image_url: img('meomum-a1'), images: [img('meomum-a1'), img('meomum-a2')], created_at: now(60*5), likes_count: 12 },
        { id: 2, user_id: 3, place_name: '바 한 잔', category: '혼술바', region: '서울', address: '서울 성동구 성수동',
          lat: 37.5446, lng: 127.0557, caption: '바 좌석이 여덟 개뿐인 작은 곳. 바텐더분이 말을 많이 걸지 않아서 좋았습니다.\n위스키 한 잔 시켜두고 하루를 돌아보기 좋은 곳.',
          image_url: img('meomum-b1'), images: [img('meomum-b1')], created_at: now(60*28), likes_count: 8 },
        { id: 3, user_id: 1, place_name: '아침의 테이블', category: '브런치카페', region: '부산', address: '부산 수영구 광안동',
          lat: 35.1532, lng: 129.1186, caption: '평일 오전 10시, 바다가 보이는 2층 구석 자리.\n수프와 빵이 정갈하고, 테이블 간격이 넓어서 옆 사람 신경 쓰지 않고 앉아 있을 수 있어요.',
          image_url: img('meomum-c1'), images: [img('meomum-c1'), img('meomum-c2'), img('meomum-c3')], created_at: now(60*50), likes_count: 21 },
        { id: 4, user_id: 2, place_name: '한 그릇 식당', category: '식당', region: '제주', address: '제주 제주시 애월읍',
          lat: 33.4630, lng: 126.3300, caption: '1인 좌석이 창을 향해 놓여 있는 국수집.\n바람 소리 들으며 천천히 먹었습니다. 혼자 밥 먹는 게 전혀 어색하지 않은 곳.',
          image_url: img('meomum-d1'), images: [img('meomum-d1')], created_at: now(60*80), likes_count: 15 },
        { id: 5, user_id: 3, place_name: '숲 옆 카페', category: '카페', region: '강원', address: '강원 강릉시 사천면',
          lat: 37.8270, lng: 128.8600, caption: '소나무 숲이 바로 보이는 통창. 와이파이가 없어서 오히려 좋았어요.',
          image_url: img('meomum-e1'), images: [img('meomum-e1'), img('meomum-e2')], created_at: now(60*130), likes_count: 30 },
        { id: 6, user_id: 1, place_name: '저녁의 서가', category: '혼술바', region: '경기', address: '경기 수원시 행궁동',
          lat: 37.2850, lng: 127.0130, caption: '책을 읽으며 한 잔 할 수 있는 북바. 조명이 낮고 음악이 잔잔합니다.',
          image_url: img('meomum-f1'), images: [img('meomum-f1')], created_at: now(60*200), likes_count: 6 },
      ],
      comments: [

  function loadDB() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      db = raw ? JSON.parse(raw) : seedData();
    } catch { db = seedData(); }
  }
  function saveDB() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
    catch { toast('저장 공간이 부족해요. 사진 수를 줄여주세요.'); return false; }
  }
  function nextId(table) { db.seq[table] += 1; return db.seq[table]; }

  /* 로그인 상태 */
  function getSessionId() { try { return Number(localStorage.getItem(SESSION_KEY)) || null; } catch { return null; } }
  function setSession(id) { try { id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); } catch {} }
  function me() { return db.users.find(u => u.id === getSessionId()) || null; }
  const userById = id => db.users.find(u => u.id === id);

  /* ---------- 2. 작은 도우미 함수들 ---------- */
  const $ = sel => document.querySelector(sel);
  const app = $('#app');

  function esc(s = '') {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso)) / 1000;
    if (diff < 60) return '방금 전';
    if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
    if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}일 전`;
    return fmtDate(iso);
  }
  function fmtDate(iso, withTime = false) {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    const base = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
    return withTime ? `${base} ${p(d.getHours())}:${p(d.getMinutes())}` : base;
  }
  function avatarHTML(user, cls = '') {
    if (!user) return `<span class="avatar ${cls}">?</span>`;
    return user.profile_image
      ? `<img class="avatar ${cls}" src="${esc(user.profile_image)}" alt="">`
      : `<span class="avatar ${cls}">${esc(user.display_name.slice(0, 1))}</span>`;
  }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const catIcon = key => (CATEGORIES.find(c => c.key === key) || {}).ico || '📍';
  const commentCount = postId => db.comments.filter(c => c.post_id === postId).length;

  /* 사진을 작게 줄여서 저장 (저장 공간 절약) */
  function resizeImage(file, max = 1000) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const im = new Image();
        im.onload = () => {
          const scale = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.75));
        };
        im.onerror = reject;
        im.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* 지도 만들기 (Leaflet + OpenStreetMap) */
  let maps = [];
  function makeMap(el, center, zoom) {
    if (typeof L === 'undefined') { el.innerHTML = '<div class="empty">지도를 불러오지 못했어요 (인터넷 연결 확인)</div>'; return null; }
    const m = L.map(el, { zoomControl: true, attributionControl: true }).setView(center, zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(m);
    maps.push(m);
    return m;
  }
  const pin = () => L.divIcon({
    className: '', iconSize: [28, 28], iconAnchor: [14, 28],
    html: '<div style="width:28px;height:28px;border-radius:50% 50% 50% 0;background:#6A5A8C;transform:rotate(-45deg);border:3px solid #F3EEE2;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>'
  });

  /* 공간 카드 HTML */
  function postCard(p) {
    return `

                <b style="font-size:14px">${esc(cu?.display_name || '알 수 없음')}</b>

    $('#likeBtn').onclick = () => {

      const i = list.indexOf(p.id);
      if (i >= 0) { list.splice(i, 1); p.likes_count = Math.max(0, p.likes_count - 1); }

      saveDB(); renderDetail(id);

    const m = makeMap($('#detailMap'), [p.lat, p.lng], 15);
    if (m) L.marker([p.lat, p.lng], { icon: pin() }).addTo(m);
  }

      <div class="page">
        <h1 class="page-title">공간 기록하기</h1>
        <p class="page-sub">머물렀던 곳의 느낌을 남겨주세요</p>

        <div class="write-meta">
          <div style="display:flex;gap:10px;align-items:center">${avatarHTML(user)}<div><b>${esc(user.display_name)}</b><div class="faint">@${esc(user.username)}</div></div></div>
          <div class="faint" style="text-align:right">작성 시간<br><b id="clock" style="color:var(--ink)">${fmtDate(startedAt, true)}</b></div>
        </div>

        <form id="writeForm" novalidate>
          <div class="field"><label>공간 이름 *</label><input class="input" name="place_name" maxlength="40" placeholder="예) 골목 끝 서재"></div>
          <div class="row">
            <div class="field"><label>종류 *</label>
              <select class="select" name="category">${CATEGORIES.map(c => `<option>${c.key}</option>`).join('')}</select></div>
            <div class="field"><label>지역 *</label>
              <select class="select" name="region" id="regionInput">${REGIONS.map(r => `<option>${r.key}</option>`).join('')}</select></div>
          </div>
          <div class="field"><label>주소 / 동네</label><input class="input" name="address" maxlength="60" placeholder="예) 서울 종로구 서촌"></div>

          <div class="field">
            <label>위치 * <span class="faint">— 지도를 눌러 핀을 꽂아주세요</span></label>
            <div class="map sm" id="writeMap"></div>
            <div class="row" style="margin-top:8px">
              <button type="button" class="btn btn-ghost" id="myLocBtn">📍 현재 위치 사용</button>
            </div>
            <p class="faint" id="locText" style="margin:6px 2px 0">아직 위치가 선택되지 않았어요.</p>
          </div>

          <div class="field"><label>이용 후기 *</label>
            <textarea class="textarea" name="caption" maxlength="2000" placeholder="어떤 시간이었나요? 분위기, 소리, 자리, 떠오른 생각들…"></textarea></div>

          <div class="field">
            <label>사진 첨부 * <span class="faint">(최대 6장, 첫 사진이 대표 사진)</span></label>
            <div class="photo-grid" id="photoGrid"></div>
            <input type="file" accept="image/*" multiple id="fileInput" hidden>
            <button type="button" class="btn btn-ghost btn-block" id="openPicker" style="margin-top:10px">🖼 추천 이미지에서 고르기</button>
            <div class="picker" id="picker" hidden>
              <div class="muted">마음에 드는 이미지를 누르세요</div>
              <div class="picker-grid" id="pickerGrid"></div>
              <button type="button" class="btn btn-ghost btn-block" id="refreshPicker">↻ 다른 이미지 보기</button>
            </div>
          </div>

          <button class="btn btn-primary btn-block" type="submit" style="margin-top:12px">기록 올리기</button>
        </form>
      </div>`;

    // 작성 시간 실시간 표시
    const clockTimer = setInterval(() => {
      const c = $('#clock'); if (!c) return clearInterval(clockTimer);
      c.textContent = fmtDate(new Date().toISOString(), true);
    }, 15000);

    // 사진 미리보기
    const MAX = 6;
    function drawPhotos() {
      $('#photoGrid').innerHTML =
        draft.photos.map((src, i) => `<div class="slot"><img src="${esc(src)}" alt=""><button type="button" data-i="${i}" aria-label="사진 삭제">✕</button></div>`).join('') +
        (draft.photos.length < MAX ? `<button type="button" class="photo-add" id="addPhoto">＋<br>내 사진</button>` : '');
      $('#photoGrid').querySelectorAll('.slot button').forEach(b => b.onclick = () => { draft.photos.splice(+b.dataset.i, 1); drawPhotos(); });
      const add = $('#addPhoto'); if (add) add.onclick = () => $('#fileInput').click();
    }
    drawPhotos();
    $('#fileInput').onchange = async e => {
      const files = [...e.target.files].slice(0, MAX - draft.photos.length);
      for (const f of files) { try { draft.photos.push(await resizeImage(f)); } catch { toast('사진을 읽지 못했어요.'); } }
      e.target.value = ''; drawPhotos();
    };

    // 추천 이미지 고르기 (기획서의 "Unsplash 랜덤 이미지" 단계를 대신하는 샘플 이미지)
    function fillPicker() {
      const r = Math.random().toString(36).slice(2, 7);
      $('#pickerGrid').innerHTML = Array.from({ length: 6 }, (_, i) =>
        `<img src="https://picsum.photos/seed/${r}${i}/600/450" alt="추천 이미지 ${i + 1}" loading="lazy">`).join('');
      $('#pickerGrid').querySelectorAll('img').forEach(im => im.onclick = () => {
        if (draft.photos.length >= MAX) return toast(`사진은 최대 ${MAX}장까지예요.`);
        if (draft.photos.includes(im.src)) return;
        im.classList.add('sel'); draft.photos.push(im.src); drawPhotos();
      });
    }
    $('#openPicker').onclick = () => { const pk = $('#picker'); pk.hidden = !pk.hidden; if (!pk.hidden && !$('#pickerGrid').children.length) fillPicker(); };
    $('#refreshPicker').onclick = fillPicker;

    // 위치 선택 지도
    const startRegion = REGIONS[0];
    const m = makeMap($('#writeMap'), startRegion.center, startRegion.zoom);
    let marker = null;
    function setLoc(lat, lng) {
      draft.lat = +lat.toFixed(6); draft.lng = +lng.toFixed(6);
      if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng], { icon: pin() }).addTo(m);
      $('#locText').textContent = `선택한 위치: ${draft.lat}, ${draft.lng}`;
    }
    if (m) {
      m.on('click', e => setLoc(e.latlng.lat, e.latlng.lng));
      $('#regionInput').onchange = e => { const r = REGIONS.find(r => r.key === e.target.value); m.setView(r.center, r.zoom); };
    }
    $('#myLocBtn').onclick = () => {
      if (!navigator.geolocation) return toast('이 기기에서는 위치를 가져올 수 없어요.');
      navigator.geolocation.getCurrentPosition(
        pos => { setLoc(pos.coords.latitude, pos.coords.longitude); m && m.setView([pos.coords.latitude, pos.coords.longitude], 15); },
        () => toast('위치 권한을 허용해주세요.'));
    };

    // 저장
    $('#writeForm').onsubmit = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (!f.place_name.trim()) return toast('공간 이름을 입력해주세요.');
      if (draft.lat == null) return toast('지도에서 위치를 선택해주세요.');
      if (!f.caption.trim()) return toast('이용 후기를 적어주세요.');
      if (!draft.photos.length) return toast('사진을 한 장 이상 첨부해주세요.');
      const post = {
        id: nextId('posts'), user_id: user.id,
        place_name: f.place_name.trim(), category: f.category, region: f.region, address: f.address.trim(),
        lat: draft.lat, lng: draft.lng, caption: f.caption.trim(),
        image_url: draft.photos[0], images: [...draft.photos],
        created_at: now(), likes_count: 0,
      };
      db.posts.push(post);
      if (!saveDB()) { db.posts.pop(); db.seq.posts -= 1; return; }
      clearInterval(clockTimer);
      toast('기록을 남겼어요.'); go(`#/post/${post.id}`);
    };
  }

  /* ---------- [6] 마이페이지 ---------- */
  function renderMy() {
    const user = me();
    const myPosts = db.posts.filter(p => p.user_id === user.id).sort((a, b) => b.created_at.localeCompare(a.created_at));
    const myComments = db.comments.filter(c => c.user_id === user.id).length;
    let newProfileImage = null;

    app.innerHTML = `
      <div class="page">
        <div class="card profile">
          <span id="avatarPreview">${avatarHTML(user, 'lg')}</span>
          <div style="min-width:0">
            <h2>${esc(user.display_name)}</h2>
            <div class="faint">@${esc(user.username)} · ${fmtDate(user.created_at)} 가입</div>
            <div class="stats"><span>기록 <b>${myPosts.length}</b></span><span>이야기 <b>${myComments}</b></span></div>
          </div>
        </div>
        ${user.bio ? `<p class="muted" style="margin:12px 4px 0">${esc(user.bio)}</p>` : ''}

        <h2 class="section-title">내 기록</h2>
        ${myPosts.length ? `<div class="h-scroll">${myPosts.map(postCard).join('')}</div>`
          : `<div class="empty"><div class="ico">✍️</div>아직 남긴 기록이 없어요.</div>`}

        <h2 class="section-title">내 정보 수정</h2>
        <form id="profileForm" class="card" style="padding:18px" novalidate>
          <div class="field"><label>프로필 사진</label>
            <div class="row"><button type="button" class="btn btn-ghost" id="pickAvatar">사진 선택</button>
            <button type="button" class="btn btn-ghost" id="clearAvatar">기본 이미지</button></div>
            <input type="file" accept="image/*" id="avatarFile" hidden></div>
          <div class="field"><label>이름</label><input class="input" name="display_name" value="${esc(user.display_name)}" maxlength="20"></div>
          <div class="field"><label>아이디</label><input class="input" name="username" value="${esc(user.username)}" maxlength="20"></div>
          <div class="field"><label>이메일</label><input class="input" type="email" name="email" value="${esc(user.email)}"></div>
          <div class="field"><label>소개글</label><textarea class="textarea" name="bio" maxlength="150" style="min-height:90px">${esc(user.bio)}</textarea></div>
          <div class="field"><label>주소</label><input class="input" name="address" value="${esc(user.address || '')}" placeholder="예) 서울 종로구"></div>
          <button class="btn btn-primary btn-block" type="submit">정보 저장</button>
        </form>

        <h2 class="section-title">비밀번호 변경</h2>
        <form id="pwForm" class="card" style="padding:18px" novalidate>
          <div class="field"><label>현재 비밀번호</label><input class="input" type="password" name="cur" autocomplete="current-password"></div>
          <div class="field"><label>새 비밀번호</label><input class="input" type="password" name="next" autocomplete="new-password"></div>
          <div class="field"><label>새 비밀번호 확인</label><input class="input" type="password" name="confirm" autocomplete="new-password"></div>
          <button class="btn btn-primary btn-block" type="submit">비밀번호 변경</button>
        </form>

        <hr class="divider">
        <button class="btn btn-ghost btn-block" id="logoutBtn">로그아웃</button>
        <button class="btn btn-block" id="resetBtn" style="margin-top:8px;color:var(--ink-faint);background:none">체험 데이터 초기화</button>
      </div>`;

    // 프로필 사진
    $('#pickAvatar').onclick = () => $('#avatarFile').click();
    $('#avatarFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      newProfileImage = await resizeImage(f, 300);
      $('#avatarPreview').innerHTML = `<img class="avatar lg" src="${newProfileImage}" alt="">`;
    };
    $('#clearAvatar').onclick = () => {
      newProfileImage = '';
      $('#avatarPreview').innerHTML = avatarHTML({ ...user, profile_image: '' }, 'lg');
    };

    $('#profileForm').onsubmit = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      f.email = f.email.trim().toLowerCase();
      if (!f.display_name.trim()) return toast('이름을 입력해주세요.');
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(f.username)) return toast('아이디는 영문·숫자 3~20자로 입력해주세요.');
      if (!/^\S+@\S+\.\S+$/.test(f.email)) return toast('이메일 형식을 확인해주세요.');
      if (db.users.some(u => u.id !== user.id && u.username === f.username)) return toast('이미 사용 중인 아이디예요.');
      if (db.users.some(u => u.id !== user.id && u.email === f.email)) return toast('이미 사용 중인 이메일이에요.');
      Object.assign(user, { display_name: f.display_name.trim(), username: f.username, email: f.email, bio: f.bio.trim(), address: f.address.trim() });
      if (newProfileImage !== null) user.profile_image = newProfileImage;
      saveDB(); toast('내 정보를 저장했어요.'); route();
    };

    $('#pwForm').onsubmit = e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      if (f.cur !== user.password) return toast('현재 비밀번호가 맞지 않아요.');
      if (f.next.length < 4) return toast('새 비밀번호는 4자 이상으로 해주세요.');
      if (f.next !== f.confirm) return toast('새 비밀번호가 서로 달라요.');
      user.password = f.next; saveDB(); e.target.reset(); toast('비밀번호를 변경했어요.');
    };

    $('#logoutBtn').onclick = () => { setSession(null); toast('다음에 또 머물러 오세요.'); go('#/login'); };
    const reset = $('#resetBtn');
    reset.onclick = () => {
      if (!reset.dataset.confirm) { reset.dataset.confirm = '1'; reset.textContent = '한 번 더 누르면 모든 데이터가 처음으로 돌아가요'; return; }
      db = seedData(); saveDB(); setSession(1); toast('체험 데이터를 초기화했어요.'); go('#/home');
    };
  }

  /* ================================================================
     4. 화면 전환 (주소 # 뒤 경로에 따라 페이지를 바꿔 끼움)
     ================================================================ */
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  function route() {
    maps.forEach(m => m.remove()); maps = [];
    const [path, query] = (location.hash.slice(1) || '/home').split('?');
    const params = new URLSearchParams(query || '');
    const user = me();

    // 로그인 안 했으면 로그인 화면으로
    if (!user && path !== '/login') return go('#/login');
    if (user && path === '/login') return go('#/home');

    const topbar = $('#topbar');
    topbar.hidden = !user;
    if (user) {
      $('#topAvatar').innerHTML = avatarHTML(user);
      const tab = path.startsWith('/post') ? 'list' : path.slice(1);
      document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
    }

    window.scrollTo(0, 0);
    if (path === '/login') renderAuth();
    else if (path === '/home') renderHome();
    else if (path === '/list') renderList(params);
    else if (path === '/write') renderWrite();
    else if (path === '/my') renderMy();
    else if (path.startsWith('/post/')) renderDetail(Number(path.split('/')[2]));
    else go('#/home');
  }

  loadDB();
  saveDB();
  window.addEventListener('hashchange', route);
  route();
  </script>
</body>
</html>
